services:
  # PostgreSQL Database
  - type: pserv
    name: lenny-assistant-db
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile.render-db
    envVars:
      - key: POSTGRES_USER
        value: lenny_user
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: lenny_assistant

  # FastAPI Backend
  - type: web
    name: lenny-assistant-api
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lenny-assistant-db
          property: connectionString
      - key: MODEL_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
    healthCheckPath: /health
